# BugTriage AI — Amazon Bedrock AgentCore features.
# Neither Memory nor Gateway is needed for the core triage workflow.
# Both are disabled; enable them here if adding cross-session memory or external tool targets.

memory:
  enabled: false
  name: agentmemory
  strategies: [SEMANTIC, USER_PREFERENCE]
  expiry_days: 30

gateway:
  enabled: false
  name: tools
  authorizer: AWS_IAM
  targets:
    - name: websearch
      type: connector
      connector: web-search
